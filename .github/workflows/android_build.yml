name: Android APK Build

on:
  push:
    branches: [ "main" ] # Cambia "main" por tu rama principal si es diferente
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Java (necesario para Gradle)
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Otorgar permisos de ejecución al script de Gradle
    - name: Grant execute 
